<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Glimmer &amp; Glow — মেকআপ ও ড্রেসআপ</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; min-height:100%; font-family:'Hind Siliguri',sans-serif;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; padding:0;}
  #app{width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:12px; background:linear-gradient(160deg,#FFF6F0,#FFE9F0);}
  .card{width:100%; max-width:400px; margin:0 auto; border-radius:36px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,.25); border:8px solid #fff; background:#FFF6F0;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:linear-gradient(90deg,#FF8FB3,#C9A8F5);}
  .pill{display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.9); border-radius:999px; padding:4px 12px; font-weight:800; font-size:13px; color:#4A2E4C;}
  .title{color:#fff; font-weight:800; font-size:18px; margin:0; font-family:'Baloo Da 2',sans-serif;}
  .xpbar{height:8px; background:rgba(255,255,255,.4); margin:8px 16px 0; border-radius:999px; overflow:hidden;}
  .xpfill{height:100%; background:linear-gradient(90deg,#FFC857,#FF8FB3); border-radius:999px; transition:width .3s;}
  .homepad{padding:20px; display:flex; flex-direction:column; gap:16px;}
  .hero{border-radius:24px; padding:20px; text-align:center; background:linear-gradient(160deg,#C9A8F5,#FFD3E1);}
  .hero p{color:#fff; font-weight:700; font-size:13px; margin:0 0 12px;}
  .heroav{display:flex; justify-content:center;}
  .bigbtn{width:100%; font-weight:800; padding:14px 0; border-radius:16px; box-shadow:0 4px 10px rgba(0,0,0,.08); font-size:14px;}
  .btn-gold{background:#FFC857; color:#4A2E4C;}
  .btn-pink{background:#FF8FB3; color:#fff;}
  .btn-mint{background:#9EEBCF; color:#4A2E4C;}
  .sectionlabel{font-weight:800; color:#4A2E4C; font-size:13px; margin-bottom:8px;}
  .wardrobe-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;}
  .wardrobe-item{flex-shrink:0; background:#fff; border-radius:16px; padding:4px; box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .badgegrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .badge{display:flex; flex-direction:column; align-items:center; padding:8px; border-radius:16px; background:rgba(255,255,255,.4);}
  .badge.earned{background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .badge .icon{font-size:22px; filter:grayscale(1); opacity:.4;}
  .badge.earned .icon{filter:none; opacity:1;}
  .badge .name{font-size:9px; font-weight:800; text-align:center; color:#4A2E4C; margin-top:4px; line-height:1.1;}
  .stagewrap{position:relative; display:flex; align-items:center; justify-content:center; padding:16px 0;}
  .icon-round{position:absolute; top:12px; background:rgba(255,255,255,.9); border-radius:999px; padding:8px; box-shadow:0 2px 8px rgba(0,0,0,.1); font-size:16px; line-height:1;}
  .scenerow{display:flex; gap:8px; padding:8px 16px; overflow-x:auto; background:rgba(255,255,255,.5);}
  .scenebtn{flex-shrink:0; font-size:10px; font-weight:800; padding:6px 12px; border-radius:999px; border:2px solid transparent; background:rgba(255,255,255,.6); color:#4A2E4C;}
  .scenebtn.active{border-color:#4A2E4C; background:#fff;}
  .tabs{display:flex; gap:4px; padding:8px 12px 0; background:#fff;}
  .tab{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1; padding:10px 0; border-radius:16px; opacity:.6;}
  .tab.active{background:#fff; box-shadow:0 4px 10px rgba(0,0,0,.08); transform:scale(1.05); opacity:1;}
  .tab .emoji{font-size:19px;}
  .tab .lbl{font-size:10px; font-weight:800; color:#8A6E8C;}
  .tab.active .lbl{color:#FF6F91;}
  .panel{background:#fff; padding:12px 16px 16px; min-height:190px;}
  .panelgroup{margin-bottom:12px;}
  .panellabel{font-size:12px; font-weight:800; color:#8A6E8C; margin-bottom:8px;}
  .swrow{display:flex; gap:8px; flex-wrap:wrap;}
  .swatch{position:relative; width:42px; height:42px; border-radius:50%; border:4px solid #fff; transition:transform .15s;}
  .swatch.active{border-color:#4A2E4C; transform:scale(1.1);}
  .swatch.locked{opacity:.4;}
  .swatch .mark{position:absolute; top:-4px; right:-4px; background:#fff; border-radius:50%; width:14px; height:14px; display:flex; align-items:center; justify-content:center; font-size:9px;}
  .shapebtn{padding:6px 12px; border-radius:999px; font-size:12px; font-weight:800; border:2px solid transparent; background:#f3f4f6; color:#4A2E4C;}
  .shapebtn.active{border-color:#4A2E4C; background:#FFE9F0;}
  .palettebtn{display:flex; border-radius:999px; overflow:hidden; border:2px solid #fff;}
  .palettebtn.active{border-color:#4A2E4C;}
  .palettebtn span{width:16px; height:32px; display:block;}
  .hairnum{width:36px; height:36px; border-radius:12px; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid #e5e7eb; background:#f9fafb; color:#4A2E4C;}
  .hairnum.active{border-color:#4A2E4C; background:#FFE9F0;}
  .hairgrid{display:flex; gap:8px; flex-wrap:wrap; max-height:96px; overflow-y:auto;}
  .itemgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .itembtn{position:relative; display:flex; flex-direction:column; align-items:center; padding:8px; border-radius:12px; border:2px solid #e5e7eb; background:#fff;}
  .itembtn.active{border-color:#4A2E4C; background:#FFE9F0;}
  .itemswatch{width:32px; height:32px; border-radius:8px;}
  .itemname{font-size:8px; font-weight:800; color:#4A2E4C; text-align:center; margin-top:4px; line-height:1.1;}
  .itemprice{font-size:8px; font-weight:800; color:#FF6F91; margin-top:2px;}
  .savebar{padding:0 16px 16px; background:#fff;}
  .savebtn{width:100%; background:linear-gradient(90deg,#FF8FB3,#C9A8F5); color:#fff; font-weight:800; padding:12px 0; border-radius:16px; box-shadow:0 4px 10px rgba(0,0,0,.1); font-size:14px;}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#4A2E4C; color:#fff; font-size:13px; font-weight:800; padding:10px 18px; border-radius:999px; box-shadow:0 10px 30px rgba(0,0,0,.3); z-index:50;}
  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:24px;}
  .modal{background:#fff; border-radius:24px; padding:22px; max-width:320px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.3);}
  .modal h3{font-weight:800; font-size:18px; color:#4A2E4C; margin:0 0 4px;}
  .modal-sub{font-size:13px; color:#8A6E8C; margin:0 0 16px;}
  .target-swatch{width:64px; height:64px; border-radius:50%; margin:0 auto 16px; border:4px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.15);}
  .mg-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
  .mg-opt{height:56px; border-radius:12px; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.1);}
  .mg-result{font-weight:800; margin-bottom:8px;}
  .mg-win{color:#16a34a;} .mg-lose{color:#ef4444;}
  .modal-cta{background:#FF8FB3; color:#fff; font-weight:800; padding:10px 24px; border-radius:999px; font-size:13px;}
  .modal-skip{font-size:12px; color:#8A6E8C; text-decoration:underline;}
  .modal-close-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .modal-close-row button{font-size:18px; color:#4A2E4C;}
  .photo-scene{border-radius:16px; padding:16px; margin-bottom:12px;}
  .photo-scene .avwrap{display:flex; justify-content:center;}
  .photo-scene p{color:#fff; font-size:12px; font-weight:800; margin-top:4px;}
  .sticker-row{display:flex; gap:8px; justify-content:center; margin-bottom:12px; font-size:20px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Data ----------
var SKIN_TONES = ["#FFE0BD","#F1C27D","#C68642","#8D5524","#FFDAB9","#E8B796"];
var FACE_SHAPES_LABEL = ["গোলাকার","ডিম্বাকার","হৃদয়","চৌকো"];
var FACE_KEYS = ["round","oval","heart","square"];
var LIP_COLORS = ["#E85D75","#FF8FB3","#C0392B","#FF6F91","#D35400","#B83280","#F1948A","#922B21","#EC7063","#CD6155","#FF5C8A","#E91E63","#AD1457","#F06292","#C2185B"];
var EYE_PALETTES = [
  {name:"সূর্যাস্ত", colors:["#FF8FB3","#FFC857","#FF6F91"]},
  {name:"সাগর", colors:["#9EEBCF","#5DADE2","#48C9B0"]},
  {name:"বেরি", colors:["#C9A8F5","#AD1457","#F06292"]},
  {name:"সোনালি", colors:["#FFC857","#F4D03F","#F5B041"]},
  {name:"বন", colors:["#82E0AA","#28B463","#1E8449"]},
  {name:"গোলাপি", colors:["#F1948A","#EC7063","#CD6155"]},
  {name:"আকাশ", colors:["#AED6F1","#85C1E9","#5499C7"]},
  {name:"বেগুনি", colors:["#BB8FCE","#A569BD","#8E44AD"]},
  {name:"পিচ", colors:["#FFD3A5","#FDA085","#F8B195"]},
  {name:"পুদিনা", colors:["#9EEBCF","#76D7C4","#48C9B0"]}
];
var HAIR_COLORS = ["#2C1B18","#4A2E1F","#7B3F00","#B8860B","#F4E04D","#FF8FB3","#C9A8F5","#5DADE2","#E74C3C","#1ABC9C","#EEEEEE","#7D3C98"];
var HAIR_STYLES = Array.from({length:20},function(_,i){return i+1;});
var OUTFITS = [
  {id:1,name:"রোদ্দুর ফ্রক",color:"#FFD3A5",price:0},
  {id:2,name:"গোলাপি টি-শার্ট",color:"#FF8FB3",price:0},
  {id:3,name:"বেগুনি গাউন",color:"#C9A8F5",price:150},
  {id:4,name:"পুদিনা জাম্পস্যুট",color:"#9EEBCF",price:150},
  {id:5,name:"তারার স্কার্ট",color:"#4A2E4C",price:250},
  {id:6,name:"সোনালি ঝলমল",color:"#FFC857",price:300},
  {id:7,name:"গোলাপি ওভারঅল",color:"#F1948A",price:200},
  {id:8,name:"আকাশি রোম্পার",color:"#AED6F1",price:200}
];
var ACCESSORIES = [
  {id:1,name:"মুক্তার দুল",price:0},
  {id:2,name:"বো ক্লিপ",price:0},
  {id:3,name:"তারা হার",price:100},
  {id:4,name:"সান হ্যাট",price:180},
  {id:5,name:"চকচকে ব্যাগ",price:220}
];
var SCENES = [
  {id:"salon",name:"সেলুন",grad:["#FFD3E1","#FFEFF5"]},
  {id:"party",name:"পার্টি",grad:["#C9A8F5","#F5E6FF"]},
  {id:"beach",name:"সমুদ্র সৈকত",grad:["#9EEBCF","#EAFFF8"]},
  {id:"school",name:"স্কুল",grad:["#FFD3A5","#FFF3E2"]},
  {id:"redcarpet",name:"রেড কার্পেট",grad:["#FF8FB3","#FFE1EA"]},
  {id:"stars",name:"তারার আলো",grad:["#4A2E4C","#8E6E9C"]}
];
var BADGES = [
  {id:"color_master",name:"রঙের রাণী",icon:"💄"},
  {id:"fashionista",name:"ফ্যাশনিস্তা",icon:"👗"},
  {id:"stylist",name:"স্টাইলিস্ট",icon:"✂️"},
  {id:"collector",name:"সংগ্রাহক",icon:"📸"}
];

function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ---------- State ----------
var state = {
  screen: "home",
  tab: "face",
  coins: 320,
  level: 3,
  xp: 40,
  sceneId: "salon",
  ownedOutfits: [1,2],
  ownedAccessories: [1,2],
  wardrobe: [],
  triedLips: {},
  triedHair: {},
  look: {
    skin: SKIN_TONES[0],
    faceShape: "oval",
    lipColor: LIP_COLORS[0],
    eyeColor: EYE_PALETTES[0].colors[0],
    blush: "#FF8FB3",
    hairColor: HAIR_COLORS[0],
    hairStyle: 1,
    outfitColor: OUTFITS[0].color,
    outfitId: 1,
    accessories: [1,2]
  },
  toastMsg: null,
  toastTimer: null,
  miniGameOpen: false,
  miniGameTarget: null,
  miniGameOptions: [],
  miniGameResult: null,
  photoBoothOpen: false
};

function getScene(){
  for(var i=0;i<SCENES.length;i++){ if(SCENES[i].id===state.sceneId) return SCENES[i]; }
  return SCENES[0];
}

// ---------- Avatar SVG ----------
function avatarSVG(look, size){
  size = size || 260;
  var faceRx = look.faceShape==="round"?78:look.faceShape==="square"?70:look.faceShape==="heart"?74:76;
  var faceRy = look.faceShape==="round"?78:look.faceShape==="square"?82:look.faceShape==="heart"?84:90;
  var hairBack = (look.hairStyle % 3 === 0)
    ? '<path d="M 70 160 Q 60 260 90 290 Q 100 220 95 160 Z M 230 160 Q 240 260 210 290 Q 200 220 205 160 Z" fill="'+look.hairColor+'"/>'
    : '';
  var hairFront;
  if(look.hairStyle % 5 === 0){
    hairFront = "M 70 130 Q 150 40 230 130 Q 220 90 150 80 Q 80 90 70 130 Z";
  } else if(look.hairStyle % 4 === 0){
    hairFront = "M 65 140 Q 60 60 150 55 Q 240 60 235 140 Q 210 100 150 100 Q 90 100 65 140 Z";
  } else if(look.hairStyle % 3 === 0){
    hairFront = "M 68 150 Q 55 70 150 60 Q 245 70 232 150 Q 220 95 150 90 Q 80 95 68 150 Z";
  } else {
    hairFront = "M 72 135 Q 75 55 150 50 Q 225 55 228 135 Q 200 85 150 82 Q 100 85 72 135 Z";
  }
  var acc = look.accessories || [];
  var bow = acc.indexOf(2)>-1 ? '<g transform="translate(195,70)"><path d="M 0 0 L -14 -9 L -14 9 Z" fill="#FF8FB3" stroke="#4A2E4C" stroke-width="1.5"/><path d="M 0 0 L 14 -9 L 14 9 Z" fill="#FF8FB3" stroke="#4A2E4C" stroke-width="1.5"/><circle cx="0" cy="0" r="4" fill="#E85D75"/></g>' : '';
  var earrings = acc.indexOf(1)>-1 ? '<circle cx="95" cy="175" r="4" fill="#FFF6E5" stroke="#FFC857" stroke-width="1.5"/><circle cx="205" cy="175" r="4" fill="#FFF6E5" stroke="#FFC857" stroke-width="1.5"/>' : '';
  var necklace = acc.indexOf(3)>-1 ? '<path d="M 120 232 Q 150 250 180 232" stroke="#FFC857" stroke-width="3" fill="none" stroke-linecap="round"/>' : '';
  var hat = acc.indexOf(4)>-1 ? '<ellipse cx="150" cy="80" rx="80" ry="16" fill="#FFD3A5" stroke="#4A2E4C" stroke-width="2"/>' : '';

  return '' +
  '<svg viewBox="0 0 300 340" width="'+size+'" height="'+(size*(340/300))+'" style="filter:drop-shadow(0 10px 20px rgba(0,0,0,.15))">' +
    '<defs><radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">' +
      '<stop offset="0%" stop-color="'+look.blush+'" stop-opacity="0.7"/>' +
      '<stop offset="100%" stop-color="'+look.blush+'" stop-opacity="0"/>' +
    '</radialGradient></defs>' +
    '<path d="M 90 260 Q 150 230 210 260 L 230 340 L 70 340 Z" fill="'+look.outfitColor+'" stroke="#4A2E4C" stroke-width="3" stroke-linejoin="round"/>' +
    '<rect x="135" y="205" width="30" height="35" fill="'+look.skin+'"/>' +
    hairBack +
    '<ellipse cx="150" cy="150" rx="'+faceRx+'" ry="'+faceRy+'" fill="'+look.skin+'" stroke="#4A2E4C" stroke-width="2.5"/>' +
    '<circle cx="108" cy="168" r="18" fill="url(#cheekGrad)"/>' +
    '<circle cx="192" cy="168" r="18" fill="url(#cheekGrad)"/>' +
    '<path d="M 105 128 Q 122 112 142 122 Q 122 128 108 138 Z" fill="'+look.eyeColor+'" opacity="0.85"/>' +
    '<path d="M 195 128 Q 178 112 158 122 Q 178 128 192 138 Z" fill="'+look.eyeColor+'" opacity="0.85"/>' +
    '<ellipse cx="122" cy="140" rx="10" ry="12" fill="#fff" stroke="#4A2E4C" stroke-width="2.5"/>' +
    '<ellipse cx="178" cy="140" rx="10" ry="12" fill="#fff" stroke="#4A2E4C" stroke-width="2.5"/>' +
    '<circle cx="122" cy="141" r="5" fill="#4A2E4C"/>' +
    '<circle cx="178" cy="141" r="5" fill="#4A2E4C"/>' +
    '<path d="M 112 132 Q 122 126 133 132" stroke="#2C1B18" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
    '<path d="M 188 132 Q 178 126 167 132" stroke="#2C1B18" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
    '<path d="M 108 116 Q 122 108 138 114" stroke="#4A2E1F" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    '<path d="M 192 116 Q 178 108 162 114" stroke="#4A2E1F" stroke-width="3" fill="none" stroke-linecap="round"/>' +
    '<path d="M 150 145 Q 146 162 150 168 Q 154 166 152 160" stroke="#4A2E4C" stroke-width="1.5" fill="none" opacity="0.5"/>' +
    '<path d="M 132 188 Q 150 182 168 188 Q 150 202 132 188 Z" fill="'+look.lipColor+'" stroke="#4A2E4C" stroke-width="1.5"/>' +
    '<circle cx="135" cy="162" r="3" fill="#fff" opacity="0.8"/>' +
    '<circle cx="165" cy="162" r="3" fill="#fff" opacity="0.8"/>' +
    '<path d="'+hairFront+'" fill="'+look.hairColor+'" stroke="#4A2E4C" stroke-width="2"/>' +
    bow + earrings + necklace + hat +
  '</svg>';
}

// ---------- Helpers ----------
function flash(msg){
  state.toastMsg = msg;
  render();
  if(state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(function(){ state.toastMsg = null; render(); }, 1800);
}
function badgesEarned(){
  var e = [];
  if(Object.keys(state.triedLips).length >= 10) e.push("color_master");
  if(state.ownedOutfits.length >= 5) e.push("fashionista");
  if(Object.keys(state.triedHair).length >= 5) e.push("stylist");
  if(state.wardrobe.length >= 3) e.push("collector");
  return e;
}

// ---------- Actions (exposed globally for inline onclick) ----------
function goCreate(){ state.screen = "create"; render(); }
function goHome(){ state.screen = "home"; render(); }
function claimDaily(){ state.coins += 50; flash("দৈনিক পুরস্কার: +৫০ কয়েন! 🎁"); }
function setTab(t){ state.tab = t; render(); }
function setScene(id){ state.sceneId = id; render(); }
function setSkin(c){ state.look.skin = c; render(); }
function setFaceShape(f){ state.look.faceShape = f; render(); }
function setLip(c){ state.look.lipColor = c; state.triedLips[c] = true; render(); }
function setEye(c){ state.look.eyeColor = c; render(); }
function setBlush(c){ state.look.blush = c; render(); }
function setHairStyle(h){ state.look.hairStyle = h; state.triedHair[h] = true; render(); }
function setHairColor(c){ state.look.hairColor = c; render(); }
function toggleAccessory(id){
  var idx = state.look.accessories.indexOf(id);
  if(idx>-1) state.look.accessories.splice(idx,1); else state.look.accessories.push(id);
  render();
}
function buyOutfit(id){
  var item = null;
  for(var i=0;i<OUTFITS.length;i++){ if(OUTFITS[i].id===id) item = OUTFITS[i]; }
  if(!item) return;
  var owned = state.ownedOutfits.indexOf(id) > -1;
  if(owned){ state.look.outfitColor = item.color; state.look.outfitId = item.id; render(); return; }
  if(state.coins < item.price){ flash("পর্যাপ্ত কয়েন নেই! 🪙"); return; }
  if(item.price>0) state.coins -= item.price;
  state.ownedOutfits.push(id);
  flash(item.name + " আনলক হলো! ✨");
  render();
}
function buyAccessory(id){
  var item = null;
  for(var i=0;i<ACCESSORIES.length;i++){ if(ACCESSORIES[i].id===id) item = ACCESSORIES[i]; }
  if(!item) return;
  var owned = state.ownedAccessories.indexOf(id) > -1;
  if(owned){ toggleAccessory(id); return; }
  if(state.coins < item.price){ flash("পর্যাপ্ত কয়েন নেই! 🪙"); return; }
  if(item.price>0) state.coins -= item.price;
  state.ownedAccessories.push(id);
  flash(item.name + " আনলক হলো! ✨");
  render();
}
function saveLook(){
  var copy = JSON.parse(JSON.stringify(state.look));
  copy.scene = state.sceneId;
  copy.id = Date.now();
  state.wardrobe.push(copy);
  state.xp += 15;
  if(state.xp >= 100){ state.level += 1; state.xp -= 100; }
  flash("লুক সংরক্ষণ হলো! 💾");
  render();
}
function openMiniGame(){
  var target = rnd(LIP_COLORS);
  var opts = [target];
  while(opts.length < 4){
    var c = rnd(LIP_COLORS);
    if(opts.indexOf(c) === -1) opts.push(c);
  }
  opts.sort(function(){ return Math.random()-0.5; });
  state.miniGameOpen = true;
  state.miniGameTarget = target;
  state.miniGameOptions = opts;
  state.miniGameResult = null;
  render();
}
function pickMiniGame(c){
  state.miniGameResult = (c === state.miniGameTarget) ? "win" : "lose";
  render();
}
function closeMiniGame(applyWin){
  if(applyWin && state.miniGameResult === "win"){ state.coins += 20; }
  state.miniGameOpen = false;
  render();
}
function openPhotoBooth(){ state.photoBoothOpen = true; render(); }
function closePhotoBooth(){ state.photoBoothOpen = false; render(); }
function savePhoto(){ flash("ছবি সংরক্ষণ হলো! 🖼️"); state.photoBoothOpen = false; render(); }

// ---------- Render ----------
function swatchHTML(color, active, lockedFlag, onclickAttr){
  return '<button class="swatch'+(active?' active':'')+(lockedFlag?' locked':'')+'" style="background:'+color+'" '+(lockedFlag?'':'onclick="'+onclickAttr+'"')+'>' +
    (lockedFlag ? '🔒' : (active ? '<span class="mark">✓</span>' : '')) +
    '</button>';
}

function renderTopbar(){
  return '' +
  '<div class="topbar">' +
    '<div class="pill">⭐ লেভেল '+state.level+'</div>' +
    '<h1 class="title">✨ Glimmer &amp; Glow</h1>' +
    '<div class="pill">🪙 '+state.coins+'</div>' +
  '</div>' +
  '<div class="xpbar"><div class="xpfill" style="width:'+state.xp+'%"></div></div>';
}

function renderHome(){
  var wardrobeHTML = "";
  if(state.wardrobe.length > 0){
    var items = state.wardrobe.map(function(w){
      return '<div class="wardrobe-item">'+avatarSVG(w,70)+'</div>';
    }).join("");
    wardrobeHTML = '<div><div class="sectionlabel">আমার ওয়ারড্রোব</div><div class="wardrobe-row">'+items+'</div></div>';
  }
  var earned = badgesEarned();
  var badgesHTML = BADGES.map(function(b){
    var isEarned = earned.indexOf(b.id) > -1;
    return '<div class="badge'+(isEarned?' earned':'')+'"><span class="icon">'+b.icon+'</span><span class="name">'+b.name+'</span></div>';
  }).join("");

  return '' +
  '<div class="homepad">' +
    '<div class="hero"><p>স্বাগতম, প্রিয় তারকা! 🌟</p><div class="heroav">'+avatarSVG(state.look,180)+'</div></div>' +
    '<button class="bigbtn btn-gold" onclick="claimDaily()">🎁 দৈনিক পুরস্কার নাও</button>' +
    '<button class="bigbtn btn-pink" onclick="goCreate()">✨ মেকওভার শুরু করো</button>' +
    '<button class="bigbtn btn-mint" onclick="openMiniGame()">🎮 মিনি-গেম খেলো (+কয়েন)</button>' +
    wardrobeHTML +
    '<div><div class="sectionlabel">ব্যাজ</div><div class="badgegrid">'+badgesHTML+'</div></div>' +
  '</div>';
}

function renderCreate(){
  var scene = getScene();
  var sceneButtons = SCENES.map(function(s){
    return '<button class="scenebtn'+(s.id===state.sceneId?' active':'')+'" onclick="setScene(\''+s.id+'\')">'+s.name+'</button>';
  }).join("");

  var tabs = [
    ["face","😊","মুখ"], ["makeup","💄","মেকআপ"], ["hair","✂️","চুল"],
    ["outfit","👗","পোশাক"], ["bag","👜","বাড়তি"]
  ].map(function(t){
    return '<button class="tab'+(state.tab===t[0]?' active':'')+'" onclick="setTab(\''+t[0]+'\')"><span class="emoji">'+t[1]+'</span><span class="lbl">'+t[2]+'</span></button>';
  }).join("");

  var panel = "";
  if(state.tab === "face"){
    var skinRow = SKIN_TONES.map(function(c){ return swatchHTML(c, state.look.skin===c, false, "setSkin('"+c+"')"); }).join("");
    var shapeRow = FACE_KEYS.map(function(f,i){
      return '<button class="shapebtn'+(state.look.faceShape===f?' active':'')+'" onclick="setFaceShape(\''+f+'\')">'+FACE_SHAPES_LABEL[i]+'</button>';
    }).join("");
    panel = '' +
      '<div class="panelgroup"><div class="panellabel">ত্বকের রঙ</div><div class="swrow">'+skinRow+'</div></div>' +
      '<div class="panelgroup"><div class="panellabel">মুখের গঠন</div><div class="swrow">'+shapeRow+'</div></div>';
  } else if(state.tab === "makeup"){
    var lipRow = LIP_COLORS.map(function(c){ return swatchHTML(c, state.look.lipColor===c, false, "setLip('"+c+"')"); }).join("");
    var eyeRow = EYE_PALETTES.map(function(p){
      var active = state.look.eyeColor === p.colors[0];
      var swatches = p.colors.map(function(c){ return '<span style="background:'+c+'"></span>'; }).join("");
      return '<button class="palettebtn'+(active?' active':'')+'" onclick="setEye(\''+p.colors[0]+'\')">'+swatches+'</button>';
    }).join("");
    var blushRow = ["#FF8FB3","#F1948A","#FFC0CB","#E85D75"].map(function(c){
      return swatchHTML(c, state.look.blush===c, false, "setBlush('"+c+"')");
    }).join("");
    panel = '' +
      '<div class="panelgroup"><div class="panellabel">লিপস্টিক ('+LIP_COLORS.length+' রঙ)</div><div class="swrow">'+lipRow+'</div></div>' +
      '<div class="panelgroup"><div class="panellabel">আইশ্যাডো প্যালেট</div><div class="swrow">'+eyeRow+'</div></div>' +
      '<div class="panelgroup"><div class="panellabel">ব্লাশ</div><div class="swrow">'+blushRow+'</div></div>';
  } else if(state.tab === "hair"){
    var hairNums = HAIR_STYLES.map(function(h){
      return '<button class="hairnum'+(state.look.hairStyle===h?' active':'')+'" onclick="setHairStyle('+h+')">'+h+'</button>';
    }).join("");
    var hairColorRow = HAIR_COLORS.map(function(c){ return swatchHTML(c, state.look.hairColor===c, false, "setHairColor('"+c+"')"); }).join("");
    panel = '' +
      '<div class="panelgroup"><div class="panellabel">হেয়ারস্টাইল ('+HAIR_STYLES.length+'টি)</div><div class="hairgrid">'+hairNums+'</div></div>' +
      '<div class="panelgroup"><div class="panellabel">চুলের রঙ</div><div class="swrow">'+hairColorRow+'</div></div>';
  } else if(state.tab === "outfit"){
    var outfitItems = OUTFITS.map(function(o){
      var owned = state.ownedOutfits.indexOf(o.id) > -1;
      var active = state.look.outfitId === o.id;
      return '' +
        '<button class="itembtn'+(active?' active':'')+'" onclick="buyOutfit('+o.id+')">' +
          '<span class="itemswatch" style="background:'+o.color+'"></span>' +
          '<span class="itemname">'+o.name+'</span>' +
          (owned ? '' : '<span class="itemprice">🪙'+o.price+'</span>') +
        '</button>';
    }).join("");
    panel = '<div class="panellabel">পোশাক</div><div class="itemgrid">'+outfitItems+'</div>';
  } else if(state.tab === "bag"){
    var accItems = ACCESSORIES.map(function(a){
      var owned = state.ownedAccessories.indexOf(a.id) > -1;
      var active = state.look.accessories.indexOf(a.id) > -1;
      return '' +
        '<button class="itembtn'+(active?' active':'')+'" onclick="buyAccessory('+a.id+')">' +
          '<span style="font-size:18px">💎</span>' +
          '<span class="itemname">'+a.name+'</span>' +
          (owned ? '' : '<span class="itemprice">🪙'+a.price+'</span>') +
        '</button>';
    }).join("");
    panel = '<div class="panellabel">এক্সেসরিজ</div><div class="itemgrid">'+accItems+'</div>';
  }

  return '' +
  '<div class="stagewrap" style="background:linear-gradient(160deg,'+scene.grad[0]+','+scene.grad[1]+')">' +
    '<button class="icon-round" style="left:12px" onclick="goHome()">🏠</button>' +
    '<button class="icon-round" style="right:12px" onclick="openPhotoBooth()">📷</button>' +
    avatarSVG(state.look, 210) +
  '</div>' +
  '<div class="scenerow">'+sceneButtons+'</div>' +
  '<div class="tabs">'+tabs+'</div>' +
  '<div class="panel">'+panel+'</div>' +
  '<div class="savebar"><button class="savebtn" onclick="saveLook()">💾 ওয়ারড্রোবে লুক সংরক্ষণ করো</button></div>';
}

function renderMiniGame(){
  if(!state.miniGameOpen) return "";
  var opts = state.miniGameOptions.map(function(c){
    return '<button class="mg-opt" style="background:'+c+'" '+(state.miniGameResult?'disabled':'')+' onclick="pickMiniGame(\''+c+'\')"></button>';
  }).join("");
  var resultHTML = "";
  if(state.miniGameResult === "win") resultHTML = '<p class="mg-result mg-win">🎉 ঠিক! +২০ কয়েন</p>';
  if(state.miniGameResult === "lose") resultHTML = '<p class="mg-result mg-lose">ঠিক হয়নি, আবার চেষ্টা করো!</p>';
  var footer = state.miniGameResult
    ? '<button class="modal-cta" onclick="closeMiniGame(true)">এগিয়ে যাও</button>'
    : '<button class="modal-skip" onclick="closeMiniGame(false)">বাদ দাও</button>';
  return '' +
  '<div class="modal-overlay">' +
    '<div class="modal">' +
      '<h3>রঙ মেলাও!</h3>' +
      '<p class="modal-sub">একই রঙের সোয়াচে চাপ দাও!</p>' +
      '<div class="target-swatch" style="background:'+state.miniGameTarget+'"></div>' +
      '<div class="mg-grid">'+opts+'</div>' +
      resultHTML + footer +
    '</div>' +
  '</div>';
}

function renderPhotoBooth(){
  if(!state.photoBoothOpen) return "";
  var scene = getScene();
  return '' +
  '<div class="modal-overlay">' +
    '<div class="modal">' +
      '<div class="modal-close-row"><h3>ফটো বুথ 📸</h3><button onclick="closePhotoBooth()">✕</button></div>' +
      '<div class="photo-scene" style="background:linear-gradient(160deg,'+scene.grad[0]+','+scene.grad[1]+')">' +
        '<div class="avwrap">'+avatarSVG(state.look,160)+'</div>' +
        '<p>'+scene.name+'</p>' +
      '</div>' +
      '<div class="sticker-row"><span>⭐</span><span>💖</span><span>✨</span><span>🌈</span></div>' +
      '<button class="modal-cta" style="width:100%" onclick="savePhoto()">ছবি সংরক্ষণ করো</button>' +
    '</div>' +
  '</div>';
}

function render(){
  var body = state.screen === "home" ? renderHome() : renderCreate();
  var html = '' +
  '<div class="card">' +
    renderTopbar() +
    body +
  '</div>' +
  (state.toastMsg ? '<div class="toast">'+state.toastMsg+'</div>' : '') +
  renderMiniGame() +
  renderPhotoBooth();
  document.getElementById('app').innerHTML = html;
}

render();
</script>
</body>
</html>
