name = "khukir-bagan-assets"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Create the bucket first: wrangler r2 bucket create khukir-bagan-assets
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "khukir-bagan-assets"

[vars]
# Firebase project id — same one from firebaseConfig.projectId in index.html
FIREBASE_PROJECT_ID = "hiya-2cd78"

# Comma-separated list of origins allowed to call this Worker.
# Add every domain the app is served from (Spck live preview, GitHub Pages,
# your custom domain, localhost while testing, etc).
ALLOWED_ORIGIN = "https://handfilm.github.io,http://localhost:5500"

# The URL this Worker is reachable at, used to build the public URLs
# returned from /upload/gallery. Update this once you know your final
# domain (workers.dev subdomain, or a custom route like assets.handsandhead.com).
PUBLIC_BASE_URL = "https://khukir-bagan-assets.himon.workers.dev"
