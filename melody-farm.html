<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Melody Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#CFEFFA;
    --sky-bot:#FFF4D6;
    --grass:#7CB86B;
    --grass-deep:#5E9950;
    --barn:#C1443A;
    --barn-dark:#9E332A;
    --wood:#8B5E3C;
    --wood-dark:#6E4A2E;
    --sun:#FFD166;
    --sun-dark:#D9A63B;
    --cream:#FFFDF7;
    --ink:#4A3826;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; touch-action:none;}
  body{ font-family:'Quicksand',sans-serif; background:var(--sky-bot); color:var(--ink); display:flex; align-items:center; justify-content:center; user-select:none; }
  h1,h2,h3,.display{ font-family:'Bubblegum Sans',cursive; font-weight:400; }
  #app{ position:relative; width:100vw; height:100vh; max-width:900px; max-height:900px; overflow:hidden; }
  .screen{ position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:20px; opacity:0; transition:opacity .35s ease; }
  .screen.active{ display:flex; opacity:1; }

  button{ border:none; cursor:pointer; font-family:'Bubblegum Sans',cursive; }
  .btn{ background:var(--barn); color:var(--cream); font-size:19px; padding:14px 30px; border-radius:16px;
    box-shadow:0 5px 0 var(--barn-dark); transition:transform .08s; }
  .btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--barn-dark); }
  .btn.secondary{ background:var(--grass); box-shadow:0 5px 0 var(--grass-deep); }
  .btn.secondary:active{ box-shadow:0 1px 0 var(--grass-deep); }
  .btn.ghost{ background:transparent; color:var(--ink); box-shadow:none; text-decoration:underline; font-size:14px; padding:8px; font-family:'Quicksand'; font-weight:700; }

  /* ---------- AUTH ---------- */
  #authScreen{ background:linear-gradient(180deg, var(--sky-top), var(--sky-bot)); }
  .logo-wrap{ text-align:center; margin-bottom:24px; }
  .logo-wrap .ic{ font-size:64px; filter:drop-shadow(0 6px 0 rgba(0,0,0,.12)); }
  .logo-wrap h1{ font-size:38px; margin:6px 0 4px; }
  .logo-wrap p{ margin:0; font-weight:700; color:#5E7A4E; font-size:15px; }
  .auth-actions{ display:flex; flex-direction:column; gap:12px; width:min(320px,80vw); }

  /* ---------- SETUP ---------- */
  #setupScreen{ background:linear-gradient(180deg, var(--sky-top), var(--sky-bot)); }
  .setup-card{ background:var(--cream); border-radius:22px; padding:26px 22px; width:min(360px,84vw); box-shadow:0 8px 0 rgba(0,0,0,.1); text-align:center; }
  .setup-card h2{ margin:0 0 4px; font-size:26px; }
  .setup-card .sub{ font-size:13px; color:#8a7a63; margin-bottom:16px; font-weight:700; }
  .avatar-row{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .avatar-choice{ font-size:34px; background:var(--sky-top); border-radius:14px; width:58px; height:58px; display:flex; align-items:center; justify-content:center; border:3px solid transparent; }
  .avatar-choice.selected{ border-color:var(--barn); background:#FFE3DE; transform:scale(1.08); }
  #childName{ width:100%; padding:11px 14px; border-radius:12px; border:3px solid var(--sun); font-family:'Quicksand'; font-weight:700; font-size:16px; text-align:center; margin-bottom:16px; color:var(--ink); }
  #childName:focus{ outline:none; border-color:var(--barn); }

  /* ---------- FARM SCREEN ---------- */
  #farmScreen{ justify-content:flex-start; padding:14px 10px 0; }
  .farm-top{ width:100%; display:flex; align-items:center; justify-content:space-between; padding:0 4px; }
  .badge{ display:flex; align-items:center; gap:8px; background:var(--cream); padding:6px 14px 6px 6px; border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.1);}
  .badge .av{ font-size:22px; background:var(--sky-top); border-radius:50%; width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
  .badge span{ font-weight:700; font-size:14px; }
  .unlock-count{ display:flex; align-items:center; gap:4px; background:var(--cream); padding:8px 14px; border-radius:999px; font-weight:700; box-shadow:0 3px 0 rgba(0,0,0,.1); font-size:14px;}

  .diorama{
    position:relative; width:100%; flex:1; margin-top:8px; border-radius:22px; overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-top) 32%, var(--grass) 32%, var(--grass) 68%, var(--grass-deep) 68%, var(--grass-deep) 100%);
    box-shadow:0 6px 0 rgba(0,0,0,.1);
  }
  .cloud{ position:absolute; background:#fff; border-radius:50px; opacity:.85; }
  .sun-deco{ position:absolute; top:10px; right:22px; width:46px; height:46px; border-radius:50%; background:var(--sun); box-shadow:0 0 0 8px rgba(255,209,102,.35); }
  .fence{ position:absolute; bottom:30%; left:0; right:0; height:10px; background:repeating-linear-gradient(90deg, var(--wood) 0 8px, transparent 8px 20px); opacity:.5; }

  .animal-spot{ position:absolute; display:flex; flex-direction:column; align-items:center; cursor:pointer; }
  .animal-spot .shadow-el{ width:44px; height:12px; background:rgba(0,0,0,.18); border-radius:50%; margin-top:-6px; }
  .animal-spot .emoji{ font-size:44px; filter:drop-shadow(0 4px 2px rgba(0,0,0,.2)); position:relative; z-index:2; transition:transform .08s; }
  .animal-spot.locked{ filter:grayscale(1) brightness(.75); pointer-events:none; }
  .animal-spot.locked .emoji::after{ content:"🔒"; position:absolute; top:-6px; right:-8px; font-size:16px; }
  .glow-pulse{ position:absolute; bottom:2px; width:50px; height:16px; border-radius:50%; background:var(--sun); opacity:0; }
  .animal-spot.pulse .glow-pulse{ animation:glowPulse .55s ease-out; }
  @keyframes glowPulse{ 0%{opacity:.7; transform:scale(.6);} 100%{opacity:0; transform:scale(1.8);} }
  .animal-spot.bounce .emoji{ animation:squash .32s ease; }
  @keyframes squash{ 0%{transform:scale(1,1);} 30%{transform:scale(1.25,.72) translateY(6px);} 60%{transform:scale(.86,1.18) translateY(-8px);} 100%{transform:scale(1,1);} }

  .note-particle{ position:fixed; pointer-events:none; font-size:20px; animation:noteUp .8s ease-out forwards; color:var(--barn); }
  @keyframes noteUp{ 0%{opacity:1; transform:translate(0,0) scale(.6) rotate(0);} 100%{opacity:0; transform:translate(var(--dx),-60px) scale(1.2) rotate(20deg);} }

  /* sequencer clothesline */
  .sequencer{ width:100%; margin-top:10px; background:var(--cream); border-radius:18px; padding:10px 12px; box-shadow:0 4px 0 rgba(0,0,0,.08); }
  .clothesline{ position:relative; height:40px; display:flex; align-items:center; gap:8px; overflow-x:auto; padding:0 4px; }
  .clothesline::before{ content:""; position:absolute; left:8px; right:8px; top:50%; height:2px; background:var(--wood); opacity:.4; }
  .note-dot{ width:30px; height:30px; border-radius:50%; background:var(--sky-top); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; position:relative; z-index:1; box-shadow:0 2px 0 rgba(0,0,0,.1); }
  .note-dot.active{ background:var(--sun); animation:dotPop .25s ease; }
  @keyframes dotPop{ 0%{transform:scale(.7);} 60%{transform:scale(1.25);} 100%{transform:scale(1);} }
  .empty-hint{ font-size:13px; color:#a49072; font-weight:700; padding:0 4px; }

  .controls-row{ width:100%; display:flex; justify-content:center; gap:10px; margin:10px 0 6px; flex-wrap:wrap; }
  .ctrl-btn{ display:flex; flex-direction:column; align-items:center; gap:2px; background:var(--cream); border-radius:16px; padding:10px 16px; box-shadow:0 4px 0 rgba(0,0,0,.1); font-size:12px; font-weight:700; color:var(--ink); font-family:'Quicksand'; }
  .ctrl-btn .ic{ font-size:24px; }
  .ctrl-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.1); }
  .ctrl-btn.record.recording{ background:#FFDAD4; }
  .ctrl-btn.record.recording .ic{ animation:recPulse .8s infinite; }
  @keyframes recPulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .ctrl-btn:disabled{ opacity:.4; pointer-events:none; }

  .unlock-toast{
    position:fixed; left:50%; top:14%; transform:translateX(-50%) translateY(-20px); background:var(--sun);
    color:var(--ink); font-family:'Bubblegum Sans'; font-size:16px; padding:12px 22px; border-radius:16px;
    box-shadow:0 5px 0 var(--sun-dark); opacity:0; transition:all .35s ease; z-index:80; text-align:center; pointer-events:none;
  }
  .unlock-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  ::-webkit-scrollbar{ height:0; width:0; }
</style>
</head>
<body>
<div id="app">

  <!-- AUTH -->
  <section id="authScreen" class="screen active">
    <div class="logo-wrap">
      <div class="ic">🌻</div>
      <h1>Melody Farm</h1>
      <p>Tap, sing, and record your own farm tune!</p>
    </div>
    <div class="auth-actions">
      <button class="btn" id="playGuestBtn">Start playing!</button>
      <button class="btn ghost" id="parentSignInBtn">Parent sign in</button>
    </div>
  </section>

  <!-- SETUP -->
  <section id="setupScreen" class="screen">
    <div class="setup-card">
      <h2>Who's visiting the farm?</h2>
      <div class="sub">Pick a face &amp; type your name</div>
      <div class="avatar-row" id="avatarRow"></div>
      <input id="childName" maxlength="12" placeholder="Your name">
      <button class="btn" id="setupContinueBtn" style="width:100%;">Let's go!</button>
    </div>
  </section>

  <!-- FARM SCREEN -->
  <section id="farmScreen" class="screen">
    <div class="farm-top">
      <div class="badge"><span class="av" id="homeAvatar">🧒</span><span id="homeName">Friend</span></div>
      <div class="unlock-count">🐾 <span id="unlockedCount">0</span>/8</div>
    </div>
    <div class="diorama" id="diorama">
      <div class="sun-deco"></div>
      <div class="cloud" style="width:60px;height:22px;top:14px;left:20px;"></div>
      <div class="cloud" style="width:44px;height:16px;top:34px;left:70px;"></div>
      <div class="fence"></div>
      <!-- animal-spots injected by JS -->
    </div>
    <div class="sequencer">
      <div class="clothesline" id="clothesline"></div>
    </div>
    <div class="controls-row">
      <button class="ctrl-btn record" id="recordBtn"><span class="ic">⏺️</span>Record</button>
      <button class="ctrl-btn" id="playBtn" disabled><span class="ic">▶️</span>Play</button>
      <button class="ctrl-btn" id="clearBtn" disabled><span class="ic">🗑️</span>Clear</button>
      <button class="ctrl-btn" id="saveBtn" disabled><span class="ic">⭐</span>Save</button>
    </div>
  </section>

  <div class="unlock-toast" id="unlockToast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
/* ============ FIREBASE (fill in your own config) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyA9kOUaQK0V4s9ZNV1ezgYQnq_OBFpVoSo",
  authDomain: "hiya-2cd78.firebaseapp.com",
  projectId: "hiya-2cd78",
  storageBucket: "hiya-2cd78.firebasestorage.app",
  messagingSenderId: "473906193558",
  appId: "1:473906193558:web:304cde07e050faaa308eb7"
};
let fbReady=false, auth=null, db=null, currentUid=null;
try{
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  fbReady = true;
}catch(e){ console.warn("Firebase not configured, using local storage fallback.", e); }

/* ============ AUDIO (synthesized, no files) ============ */
let actx = null;
function ensureAudio(){ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function playTone(freq, wave, dur){
  try{
    const ctx = ensureAudio();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = wave;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.22, now+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(now);
    osc.stop(now+dur+0.02);
  }catch(e){ /* audio unavailable, fail silently */ }
}

/* ============ ANIMAL / INSTRUMENT DATA ============ */
// pentatonic scale across animals so any tap sequence sounds pleasant together
const ANIMALS = [
  { id:"cow",     emoji:"🐄", x:"14%", y:"46%", freq:130.81, wave:"sine",     dur:0.5,  unlockedByDefault:true },
  { id:"chicken", emoji:"🐔", x:"78%", y:"38%", freq:587.33, wave:"square",   dur:0.16, unlockedByDefault:true },
  { id:"pig",     emoji:"🐷", x:"32%", y:"64%", freq:293.66, wave:"triangle", dur:0.3,  unlockedByDefault:true },
  { id:"sheep",   emoji:"🐑", x:"62%", y:"60%", freq:392.00, wave:"sine",     dur:0.35, unlockedByDefault:true },
  { id:"drum",    emoji:"🥁", x:"46%", y:"72%", freq:98,     wave:"triangle", dur:0.14, unlockedByDefault:false },
  { id:"xylo",    emoji:"🎹", x:"22%", y:"30%", freq:523.25, wave:"triangle", dur:0.4,  unlockedByDefault:false },
  { id:"horn",    emoji:"📯", x:"70%", y:"22%", freq:261.63, wave:"sawtooth", dur:0.4,  unlockedByDefault:false },
  { id:"bell",    emoji:"🔔", x:"50%", y:"18%", freq:659.25, wave:"sine",     dur:0.5,  unlockedByDefault:false }
];
const UNLOCK_ORDER = ["cow","chicken","pig","sheep","drum","xylo","horn","bell"];
const AVATARS = ["🧒","👧","👦","🐣","🐤"];
const MAX_TAPS = 8;

/* ============ STATE ============ */
let state = {
  childName:"", avatar:"🧒",
  unlockedAnimals:["cow","chicken","pig","sheep"],
  savedLoopsCount:0,
  isRecording:false,
  isPlaying:false,
  sequence:[] // array of animal ids
};

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ============ PERSISTENCE ============ */
function saveLocal(){
  localStorage.setItem("melodyFarmProfile", JSON.stringify({
    childName:state.childName, avatar:state.avatar,
    unlockedAnimals:state.unlockedAnimals, savedLoopsCount:state.savedLoopsCount
  }));
}
function loadLocal(){
  const raw = localStorage.getItem("melodyFarmProfile");
  if(raw){
    const d = JSON.parse(raw);
    state.childName = d.childName || "";
    state.avatar = d.avatar || "🧒";
    state.unlockedAnimals = d.unlockedAnimals || ["cow","chicken","pig","sheep"];
    state.savedLoopsCount = d.savedLoopsCount || 0;
    return true;
  }
  return false;
}
async function saveProgressRemote(){
  if(fbReady && currentUid){
    try{
      const update = {};
      update["games.melodyfarm"] = {
        childName:state.childName, avatar:state.avatar,
        unlockedAnimals:state.unlockedAnimals, savedLoopsCount:state.savedLoopsCount,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await db.collection("users").doc(currentUid).set(update, {merge:true});
    }catch(e){ console.warn("Firestore save failed, using local only.", e); }
  }
  saveLocal();
}
async function loadProgressRemote(){
  if(fbReady && currentUid){
    try{
      const doc = await db.collection("users").doc(currentUid).get();
      const d = doc.exists ? (doc.data().games && doc.data().games.melodyfarm) : null;
      if(d){
        state.childName = d.childName || "";
        state.avatar = d.avatar || "🧒";
        state.unlockedAnimals = d.unlockedAnimals || ["cow","chicken","pig","sheep"];
        state.savedLoopsCount = d.savedLoopsCount || 0;
        return true;
      }
    }catch(e){ console.warn("Firestore load failed, falling back to local.", e); }
  }
  return loadLocal();
}

/* ============ AUTH ============ */
document.getElementById("playGuestBtn").onclick = async ()=>{
  ensureAudio(); // unlock audio on first user gesture
  if(fbReady){
    try{
      const cred = await auth.signInAnonymously();
      currentUid = cred.user.uid;
    }catch(e){ console.warn("Anonymous sign-in failed, continuing offline.", e); }
  }
  const hasProfile = await loadProgressRemote();
  if(hasProfile && state.childName){ enterFarm(); }
  else{ showScreen("setupScreen"); }
};
document.getElementById("parentSignInBtn").onclick = ()=>{
  alert("Parent sign-in would open an email/password flow here — hook up firebase.auth().signInWithEmailAndPassword() with your own UI.");
};

/* ============ SETUP ============ */
function buildAvatarRow(){
  const row = document.getElementById("avatarRow");
  row.innerHTML = "";
  AVATARS.forEach(a=>{
    const el = document.createElement("div");
    el.className = "avatar-choice" + (a===state.avatar ? " selected":"");
    el.textContent = a;
    el.onclick = ()=>{
      state.avatar = a;
      document.querySelectorAll(".avatar-choice").forEach(x=>x.classList.remove("selected"));
      el.classList.add("selected");
    };
    row.appendChild(el);
  });
}
buildAvatarRow();
document.getElementById("setupContinueBtn").onclick = async ()=>{
  const name = document.getElementById("childName").value.trim();
  state.childName = name || "Friend";
  await saveProgressRemote();
  enterFarm();
};

/* ============ FARM SCREEN ============ */
function enterFarm(){
  document.getElementById("homeAvatar").textContent = state.avatar;
  document.getElementById("homeName").textContent = state.childName;
  renderFarm();
  showScreen("farmScreen");
}
function renderFarm(){
  document.getElementById("unlockedCount").textContent = state.unlockedAnimals.length;
  const diorama = document.getElementById("diorama");
  diorama.querySelectorAll(".animal-spot").forEach(el=>el.remove());
  ANIMALS.forEach(a=>{
    const unlocked = state.unlockedAnimals.includes(a.id);
    const spot = document.createElement("div");
    spot.className = "animal-spot" + (unlocked ? "" : " locked");
    spot.id = "spot-"+a.id;
    spot.style.left = a.x;
    spot.style.top = a.y;
    spot.innerHTML = `<div class="glow-pulse"></div><div class="emoji">${a.emoji}</div><div class="shadow-el"></div>`;
    if(unlocked){ spot.onclick = ()=> tapAnimal(a.id); }
    diorama.appendChild(spot);
  });
  renderClothesline();
}

function tapAnimal(id, isPlayback){
  const a = ANIMALS.find(x=>x.id===id);
  const spot = document.getElementById("spot-"+id);
  spot.classList.remove("bounce","pulse"); void spot.offsetWidth; spot.classList.add("bounce","pulse");
  playTone(a.freq, a.wave, a.dur);
  spawnNoteParticle(spot);
  if(!isPlayback && state.isRecording && state.sequence.length < MAX_TAPS){
    state.sequence.push(id);
    renderClothesline();
    if(state.sequence.length >= MAX_TAPS){ stopRecording(); }
  }
}

function spawnNoteParticle(spot){
  const rect = spot.getBoundingClientRect();
  const icons = ["♪","♫","★"];
  for(let i=0;i<3;i++){
    const p = document.createElement("div");
    p.className = "note-particle";
    p.textContent = icons[i%3];
    p.style.left = (rect.left+rect.width/2+(Math.random()*30-15))+"px";
    p.style.top = (rect.top+rect.height/2)+"px";
    p.style.setProperty("--dx",(Math.random()*50-25)+"px");
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 850);
  }
}

/* ---- sequencer track ---- */
function renderClothesline(){
  const line = document.getElementById("clothesline");
  line.innerHTML = "";
  if(state.sequence.length===0){
    line.innerHTML = `<span class="empty-hint">Tap Record, then tap animals to make a tune!</span>`;
  }else{
    state.sequence.forEach((id,i)=>{
      const a = ANIMALS.find(x=>x.id===id);
      const dot = document.createElement("div");
      dot.className = "note-dot";
      dot.id = "dot-"+i;
      dot.textContent = a.emoji;
      line.appendChild(dot);
    });
  }
  document.getElementById("playBtn").disabled = state.sequence.length===0 || state.isRecording;
  document.getElementById("clearBtn").disabled = state.sequence.length===0 || state.isRecording;
  document.getElementById("saveBtn").disabled = state.sequence.length===0 || state.isRecording;
}

/* ---- controls ---- */
document.getElementById("recordBtn").onclick = ()=>{
  if(state.isPlaying) return;
  if(state.isRecording){ stopRecording(); }
  else{ startRecording(); }
};
function startRecording(){
  state.isRecording = true;
  state.sequence = [];
  document.getElementById("recordBtn").classList.add("recording");
  renderClothesline();
}
function stopRecording(){
  state.isRecording = false;
  document.getElementById("recordBtn").classList.remove("recording");
  renderClothesline();
}

document.getElementById("playBtn").onclick = ()=> playSequence();
async function playSequence(){
  if(state.isPlaying || state.sequence.length===0) return;
  state.isPlaying = true;
  document.getElementById("playBtn").disabled = true;
  document.getElementById("recordBtn").disabled = true;
  for(let i=0;i<state.sequence.length;i++){
    document.querySelectorAll(".note-dot").forEach(d=>d.classList.remove("active"));
    const dot = document.getElementById("dot-"+i);
    if(dot) dot.classList.add("active");
    tapAnimal(state.sequence[i], true);
    await new Promise(res=>setTimeout(res, 420));
  }
  document.querySelectorAll(".note-dot").forEach(d=>d.classList.remove("active"));
  state.isPlaying = false;
  document.getElementById("playBtn").disabled = false;
  document.getElementById("recordBtn").disabled = false;
}

document.getElementById("clearBtn").onclick = ()=>{
  if(state.isRecording || state.isPlaying) return;
  state.sequence = [];
  renderClothesline();
};

document.getElementById("saveBtn").onclick = async ()=>{
  if(state.isRecording || state.isPlaying || state.sequence.length===0) return;
  state.savedLoopsCount++;
  maybeUnlockNext();
  await saveProgressRemote();
  renderFarm();
};

function maybeUnlockNext(){
  const nextIdx = state.unlockedAnimals.length;
  if(nextIdx < UNLOCK_ORDER.length){
    const nextId = UNLOCK_ORDER[nextIdx];
    if(!state.unlockedAnimals.includes(nextId)){
      state.unlockedAnimals.push(nextId);
      const a = ANIMALS.find(x=>x.id===nextId);
      showUnlockToast(`New friend! ${a.emoji} joined the farm!`);
    }
  }
}
function showUnlockToast(msg){
  const toast = document.getElementById("unlockToast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=> toast.classList.remove("show"), 2200);
}

/* ============ BOOT ============ */
window.addEventListener("load", ()=>{
  if(fbReady){
    let sessionChecked = false;
    auth.onAuthStateChanged(async (user)=>{
      if(sessionChecked) return;
      sessionChecked = true;
      if(user && !user.isAnonymous){
        currentUid = user.uid;
        const hasProfile = await loadProgressRemote();
        if(hasProfile && state.childName){ enterFarm(); }
        else{ showScreen("setupScreen"); }
      }
    });
  }
});
</script>
