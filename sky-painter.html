<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Sky Painter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6F59;
    --coral-dark:#E0543F;
    --teal:#2FA8B0;
    --teal-dark:#1E7A80;
    --sungold:#FFD866;
    --sungold-dark:#C79B2E;
    --ink:#06222E;
    --font-display:'Baloo 2', system-ui, sans-serif;
    --font-body:'Quicksand', system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:var(--font-body); background:#060B1F;}
  #app{position:fixed; inset:0; width:100%; height:100%;}

  .screen{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; width:100%; height:100%; }
  .screen.active{ display:flex; }

  .btn{
    font-family:var(--font-display); font-weight:700; font-size:1.05rem; color:#fff; border:none;
    border-radius:999px; padding:0.85em 1.7em; cursor:pointer; position:relative;
    transition:transform 0.12s ease, box-shadow 0.12s ease; background:var(--coral);
    box-shadow:0 6px 0 var(--coral-dark), 0 10px 18px rgba(0,0,0,0.35), inset 0 2px 4px rgba(255,255,255,0.45), inset 0 -6px 10px rgba(0,0,0,0.12);
  }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--coral-dark), 0 4px 8px rgba(0,0,0,0.3); }
  .btn.secondary{ background:var(--teal); box-shadow:0 6px 0 var(--teal-dark), 0 10px 18px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -6px 10px rgba(0,0,0,0.12); }
  .btn.secondary:active{ box-shadow:0 2px 0 var(--teal-dark), 0 4px 8px rgba(0,0,0,0.3); }
  .btn.gold{ background:var(--sungold); color:#5A4200; box-shadow:0 6px 0 var(--sungold-dark), 0 10px 18px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.6), inset 0 -6px 10px rgba(0,0,0,0.08);}
  .btn.gold:active{ box-shadow:0 2px 0 var(--sungold-dark), 0 4px 8px rgba(0,0,0,0.25); }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-round{ width:52px; height:52px; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center; font-size:1.3rem; }

  /* ---------- Auth / Setup (shared look) ---------- */
  #authScreen, #setupScreen{ background:radial-gradient(ellipse at 50% 0%, #16224A, #060B1F 70%); }
  .auth-card, .setup-card{
    background:rgba(10,20,45,0.55); backdrop-filter:blur(6px); border:2px solid rgba(255,255,255,0.15);
    border-radius:28px; padding:2rem 1.8rem; width:min(90vw,380px); text-align:center; box-shadow:0 20px 40px rgba(0,0,0,0.4);
  }
  .logo-title{ font-family:var(--font-display); font-size:2.1rem; color:#FFF6E0; text-shadow:0 3px 0 rgba(0,0,0,0.25); margin:0 0 0.2rem; }
  .logo-sub{ color:#AEC7E6; font-size:0.95rem; margin-bottom:1.4rem; }
  .field{ width:100%; padding:0.85em 1.1em; margin-bottom:0.7rem; border-radius:16px; border:none; font-family:var(--font-body); font-weight:600; font-size:1rem; background:rgba(255,255,255,0.92); color:var(--ink); }
  .field:focus{ outline:3px solid var(--sungold); }
  .tab-row{ display:flex; gap:0.5rem; margin-bottom:1rem; }
  .tab-btn{ flex:1; padding:0.55em; border-radius:14px; border:2px solid rgba(255,255,255,0.25); background:transparent; color:#AEC7E6; font-family:var(--font-display); font-weight:700; cursor:pointer; font-size:0.95rem; }
  .tab-btn.active{ background:var(--teal); color:#fff; border-color:var(--teal); }
  .auth-error{ color:#FFB4A8; font-size:0.85rem; min-height:1.2em; margin-bottom:0.5rem; }
  .divider{ display:flex; align-items:center; gap:0.7rem; color:#7F9BC0; font-size:0.8rem; margin:0.9rem 0; }
  .divider::before, .divider::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,0.2); }
  .stack{ display:flex; flex-direction:column; gap:0.6rem; }
  .guest-note{ font-size:0.75rem; color:#7F9BC0; margin-top:0.9rem; line-height:1.4; }
  .age-row{ display:flex; gap:0.6rem; justify-content:center; margin:1rem 0 1.5rem; flex-wrap:wrap; }
  .age-pill{ width:52px; height:52px; border-radius:50%; border:none; cursor:pointer; font-family:var(--font-display); font-weight:800; font-size:1.2rem; color:#fff; background:var(--teal); box-shadow:0 5px 0 var(--teal-dark), inset 0 2px 3px rgba(255,255,255,0.4); }
  .age-pill.selected{ background:var(--coral); box-shadow:0 5px 0 var(--coral-dark), inset 0 2px 3px rgba(255,255,255,0.5); transform:translateY(-2px); }

  /* ---------- Home / Painting screen ---------- */
  #homeScreen{ overflow:hidden; }
  #skyCanvas, #drawCanvas{ position:absolute; top:0; left:0; width:100%; height:100%; touch-action:none; }
  #skyCanvas{ z-index:1; }
  #drawCanvas{ z-index:2; }

  .topbar{ position:absolute; top:0; left:0; right:0; z-index:30; display:flex; justify-content:space-between; align-items:center; padding:0.8rem 0.9rem; pointer-events:none; }
  .topbar > *{ pointer-events:auto; }
  .greet{ font-family:var(--font-display); color:#FFF6E0; font-size:0.95rem; background:rgba(6,15,30,0.4); padding:0.4em 0.9em; border-radius:16px; }
  .top-actions{ display:flex; gap:0.5rem; }
  .gallery-btn{ position:relative; }
  .gallery-badge{ position:absolute; top:-6px; right:-6px; background:var(--sungold); color:#5A4200; font-family:var(--font-display); font-weight:800; font-size:0.7rem; min-width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #060B1F; }

  .toolbar{
    position:absolute; bottom:0; left:0; right:0; z-index:30;
    background:rgba(6,15,30,0.55); backdrop-filter:blur(8px);
    padding:0.7rem 0.7rem calc(0.7rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:0.55rem;
  }
  .tool-row{ display:flex; align-items:center; gap:0.5rem; overflow-x:auto; padding-bottom:2px; }
  .swatch{
    width:38px; height:38px; border-radius:50%; border:3px solid rgba(255,255,255,0.5); flex:0 0 auto; cursor:pointer;
    box-shadow:0 3px 6px rgba(0,0,0,0.3), inset 0 2px 3px rgba(255,255,255,0.35);
  }
  .swatch.selected{ border-color:#fff; transform:scale(1.15); box-shadow:0 0 0 3px var(--sungold), 0 3px 6px rgba(0,0,0,0.3); }
  .tool-btn{
    flex:0 0 auto; width:44px; height:44px; border-radius:14px; border:none; cursor:pointer;
    background:rgba(255,255,255,0.12); color:#fff; font-size:1.2rem; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.15);
  }
  .tool-btn.active{ background:var(--coral); box-shadow:0 4px 0 var(--coral-dark), inset 0 2px 3px rgba(255,255,255,0.4); }
  .size-dot{ border-radius:50%; background:#fff; }
  .stamp-tray{ display:flex; gap:0.5rem; overflow-x:auto; padding:0.3rem 0; }
  .stamp-btn{
    flex:0 0 auto; width:52px; height:52px; border-radius:16px; border:none; cursor:pointer;
    background:rgba(255,255,255,0.14); display:flex; align-items:center; justify-content:center; font-size:1.5rem;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,0.15);
  }
  .stamp-btn.active{ background:var(--sungold); box-shadow:0 4px 0 var(--sungold-dark); }
  .hidden{ display:none !important; }
  .main-actions{ display:flex; gap:0.5rem; justify-content:space-between; }
  .main-actions .btn{ flex:1; padding:0.65em 0.4em; font-size:0.9rem; text-align:center; }

  .toast{
    position:fixed; top:16%; left:50%; transform:translateX(-50%) translateY(-10px); z-index:200;
    background:rgba(6,15,30,0.85); color:#FFF6E0; font-family:var(--font-display); font-weight:700;
    padding:0.7em 1.4em; border-radius:16px; opacity:0; pointer-events:none; transition:opacity 0.25s ease, transform 0.25s ease;
    font-size:1rem;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Gallery screen ---------- */
  #galleryScreen{ background:#0E1B38; }
  .gallery-header{ width:100%; display:flex; align-items:center; gap:0.8rem; padding:1rem 1.2rem; }
  .gallery-title{ font-family:var(--font-display); font-size:1.4rem; color:#FFF6E0; flex:1; text-align:center; margin-right:52px; }
  .gallery-grid{ width:100%; flex:1; overflow-y:auto; padding:0.5rem 1rem 2rem; display:grid; grid-template-columns:repeat(3,1fr); gap:0.8rem; }
  .gallery-item{ position:relative; border-radius:16px; overflow:hidden; background:#16224A; aspect-ratio:1/1; box-shadow:0 6px 14px rgba(0,0,0,0.3); }
  .gallery-item img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .gallery-empty{ grid-column:1/-1; text-align:center; color:#AEC7E6; font-family:var(--font-body); font-weight:600; padding:2rem 1rem; }

  #viewerModal{ position:fixed; inset:0; z-index:150; display:none; align-items:center; justify-content:center; background:rgba(3,8,20,0.8); flex-direction:column; padding:1.2rem; }
  #viewerModal.active{ display:flex; }
  #viewerModal img{ max-width:92vw; max-height:70vh; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .viewer-actions{ display:flex; gap:0.8rem; margin-top:1.2rem; }

  @media (prefers-reduced-motion: reduce){ * { animation:none !important; } }
</style>
</head>
<body>
<div id="app">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="screen active">
    <div class="auth-card">
      <h1 class="logo-title">🎨 Sky Painter</h1>
      <p class="logo-sub">Draw, glow, and fly through the sky.</p>
      <div class="tab-row">
        <button class="tab-btn active" id="tabSignIn">Sign In</button>
        <button class="tab-btn" id="tabSignUp">Sign Up</button>
      </div>
      <div class="stack">
        <input type="email" class="field" id="authEmail" placeholder="Parent email" autocomplete="email">
        <input type="password" class="field" id="authPassword" placeholder="Password" autocomplete="current-password">
      </div>
      <p class="auth-error" id="authError"></p>
      <button class="btn" id="authSubmitBtn" style="width:100%;">Sign In</button>
      <div class="divider">or</div>
      <div class="stack">
        <button class="btn secondary" id="googleBtn" style="width:100%;">Continue with Google</button>
        <button class="btn gold" id="guestBtn" style="width:100%;">Play as Guest</button>
      </div>
      <p class="guest-note" id="firebaseNote"></p>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="screen">
    <div class="setup-card">
      <h1 class="logo-title" style="font-size:1.5rem;">Who's painting today?</h1>
      <input type="text" class="field" id="childName" placeholder="Little artist's name" maxlength="20" style="margin-top:1rem;">
      <p style="color:#AEC7E6; font-family:var(--font-display); margin:1rem 0 0.4rem;">How old?</p>
      <div class="age-row" id="ageRow">
        <button class="age-pill" data-age="3">3</button>
        <button class="age-pill" data-age="4">4</button>
        <button class="age-pill" data-age="5">5</button>
        <button class="age-pill" data-age="6">6</button>
        <button class="age-pill" data-age="7">7</button>
      </div>
      <button class="btn" id="startBtn" style="width:100%;">Start Painting! 🖌️</button>
    </div>
  </div>

  <!-- HOME / PAINT SCREEN -->
  <div id="homeScreen" class="screen">
    <canvas id="skyCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>

    <div class="topbar">
      <div class="greet" id="greetText">Hi!</div>
      <div class="top-actions">
        <button class="btn secondary btn-round" id="skyToggleBtn" title="Change sky">☀️</button>
        <button class="btn gold btn-round gallery-btn" id="galleryOpenBtn" title="My Gallery">🖼️<span class="gallery-badge" id="galleryBadge">0</span></button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tool-row" id="colorRow"></div>
      <div class="tool-row">
        <button class="tool-btn" id="sizeSmall"><span class="size-dot" style="width:6px;height:6px;"></span></button>
        <button class="tool-btn" id="sizeMedium"><span class="size-dot" style="width:11px;height:11px;"></span></button>
        <button class="tool-btn" id="sizeLarge"><span class="size-dot" style="width:16px;height:16px;"></span></button>
        <button class="tool-btn" id="neonToggle" title="Neon brush">✨</button>
        <button class="tool-btn" id="stampToggle" title="Stickers">⭐</button>
      </div>
      <div class="stamp-tray hidden" id="stampTray">
        <button class="stamp-btn" data-stamp="sun">☀️</button>
        <button class="stamp-btn" data-stamp="cloud">☁️</button>
        <button class="stamp-btn" data-stamp="star">⭐</button>
        <button class="stamp-btn" data-stamp="kite">🪁</button>
        <button class="stamp-btn" data-stamp="balloon">🎈</button>
      </div>
      <div class="main-actions">
        <button class="btn secondary" id="clearBtn">New Sky 🧹</button>
        <button class="btn" id="saveBtn">Save 💾</button>
      </div>
    </div>
  </div>

  <!-- GALLERY SCREEN -->
  <div id="galleryScreen" class="screen">
    <div class="gallery-header">
      <button class="btn secondary btn-round" id="galleryBackBtn">←</button>
      <h1 class="gallery-title">My Gallery</h1>
    </div>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- VIEWER MODAL -->
  <div id="viewerModal">
    <img id="viewerImg" src="" alt="Saved painting">
    <div class="viewer-actions">
      <button class="btn secondary" id="viewerCloseBtn">Close</button>
      <button class="btn" id="viewerDeleteBtn" style="background:var(--coral);">Delete 🗑️</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
/* =========================================================================
   SKY PAINTER — single file kids app
   Replace firebaseConfig with your own Firebase project credentials to
   enable email/Google auth + Storage/Firestore gallery sync.
   Suggested Firestore/Storage rules: restrict children/{uid} and
   artwork/{uid}/** paths to request.auth.uid == uid.
   ========================================================================= */

const firebaseConfig = {
  apiKey: "AIzaSyA9kOUaQK0V4s9ZNV1ezgYQnq_OBFpVoSo",
  authDomain: "hiya-2cd78.firebaseapp.com",
  projectId: "hiya-2cd78",
  storageBucket: "hiya-2cd78.firebasestorage.app",
  messagingSenderId: "473906193558",
  appId: "1:473906193558:web:304cde07e050faaa308eb7"
};

let firebaseReady = false;
let auth = null, db = null, storage = null;
try{
  if(firebaseConfig.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    auth = firebase.auth();
    db = firebase.firestore();
    storage = firebase.storage();
    firebaseReady = true;
  }
}catch(e){
  console.warn("Firebase not configured, running in local-only mode.", e);
}

let currentUser = null; // { uid, guest:boolean }
let childProfile = { name:'', age:'' };
let selectedAge = null;

// If a parent already signed into the main Khukir Bagan app in this browser,
// reuse that session instead of asking to log in again here.
let sessionChecked = false;
if(firebaseReady){
  auth.onAuthStateChanged(async (user) => {
    if(sessionChecked) return;
    sessionChecked = true;
    if(user && !user.isAnonymous){
      currentUser = { uid: user.uid, guest:false };
      await afterAuth();
    }
  });
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------------- Auth ---------------- */
let authMode = 'signin';
const tabSignIn = document.getElementById('tabSignIn');
const tabSignUp = document.getElementById('tabSignUp');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const authError = document.getElementById('authError');
const firebaseNote = document.getElementById('firebaseNote');

if(!firebaseReady){
  firebaseNote.textContent = "Email and Google sign-in need Firebase setup. Tap “Play as Guest” to start painting now!";
  document.getElementById('googleBtn').disabled = true;
  authSubmitBtn.disabled = true;
  document.getElementById('authEmail').disabled = true;
  document.getElementById('authPassword').disabled = true;
}

tabSignIn.addEventListener('click', () => {
  authMode = 'signin'; tabSignIn.classList.add('active'); tabSignUp.classList.remove('active');
  authSubmitBtn.textContent = 'Sign In'; authError.textContent = '';
});
tabSignUp.addEventListener('click', () => {
  authMode = 'signup'; tabSignUp.classList.add('active'); tabSignIn.classList.remove('active');
  authSubmitBtn.textContent = 'Sign Up'; authError.textContent = '';
});
authSubmitBtn.addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const pw = document.getElementById('authPassword').value;
  authError.textContent = '';
  if(!email || !pw){ authError.textContent = 'Please fill in both fields.'; return; }
  try{
    const cred = authMode === 'signup'
      ? await auth.createUserWithEmailAndPassword(email, pw)
      : await auth.signInWithEmailAndPassword(email, pw);
    currentUser = { uid: cred.user.uid, guest:false };
    await afterAuth();
  }catch(e){ authError.textContent = friendlyAuthError(e); }
});
document.getElementById('googleBtn').addEventListener('click', async () => {
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    const cred = await auth.signInWithPopup(provider);
    currentUser = { uid: cred.user.uid, guest:false };
    await afterAuth();
  }catch(e){ authError.textContent = friendlyAuthError(e); }
});
document.getElementById('guestBtn').addEventListener('click', async () => {
  currentUser = { uid:'guest', guest:true };
  await afterAuth();
});
function friendlyAuthError(e){
  const msg = (e && e.code) || '';
  if(msg.includes('wrong-password') || msg.includes('user-not-found') || msg.includes('invalid-credential')) return "That email or password doesn't match.";
  if(msg.includes('email-already-in-use')) return "That email already has an account — try Sign In.";
  if(msg.includes('weak-password')) return "Password should be at least 6 characters.";
  return "Something went wrong. Please try again.";
}

function profileKey(){ return 'skypainter_profile_' + (currentUser ? currentUser.uid : 'guest'); }
function galleryKey(){ return 'skypainter_gallery_' + (currentUser ? currentUser.uid : 'guest'); }

function saveLocalProfile(){ try{ localStorage.setItem(profileKey(), JSON.stringify(childProfile)); }catch(e){} }
function loadLocalProfile(){ try{ const raw = localStorage.getItem(profileKey()); if(raw) return JSON.parse(raw); }catch(e){} return null; }
async function saveRemoteProfile(){
  if(!firebaseReady || !db || !currentUser || currentUser.guest) return;
  try{
    const update = {};
    update['games.skypainter'] = {
      name: childProfile.name, age: childProfile.age, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('users').doc(currentUser.uid).set(update, { merge:true });
  }catch(e){ console.warn('Firestore profile save failed.', e); }
}
async function loadRemoteProfile(){
  if(!firebaseReady || !db || !currentUser || currentUser.guest) return null;
  try{ const doc = await db.collection('users').doc(currentUser.uid).get(); if(doc.exists) return (doc.data().games && doc.data().games.skypainter) || null; }
  catch(e){ console.warn('Firestore profile load failed.', e); }
  return null;
}

async function afterAuth(){
  const remote = await loadRemoteProfile();
  const local = loadLocalProfile();
  const existing = remote || local;
  if(existing && existing.name){
    childProfile = { name: existing.name, age: existing.age };
    saveLocalProfile();
    enterHome();
  }else{
    showScreen('setupScreen');
  }
}

document.querySelectorAll('.age-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.age-pill').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected'); selectedAge = btn.dataset.age;
  });
});
document.getElementById('startBtn').addEventListener('click', () => {
  const name = document.getElementById('childName').value.trim() || 'Little Artist';
  childProfile = { name, age: selectedAge || '4' };
  saveLocalProfile(); saveRemoteProfile();
  enterHome();
});

function enterHome(){
  document.getElementById('greetText').textContent = `Hi, ${childProfile.name}! 👋`;
  showScreen('homeScreen');
  resizeCanvases();
  refreshGalleryBadge();
  startLoop();
}

/* ==========================================================================
   SKY + CANVAS ENGINE
   ========================================================================= */
const skyCanvas = document.getElementById('drawCanvas') ? document.getElementById('skyCanvas') : null;
const drawCanvas = document.getElementById('drawCanvas');
const skyCtx = skyCanvas.getContext('2d');
const drawCtx = drawCanvas.getContext('2d');

function resizeCanvases(){
  [skyCanvas, drawCanvas].forEach(c => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
}
window.addEventListener('resize', resizeCanvases);

/* ---- Sky phase & color interpolation ---- */
const SKY_STOPS = [
  { top:[87,184,232],  horizon:[223,246,255] },   // day
  { top:[106,76,147],  horizon:[255,140,105] },   // sunset (top->mid handled by 3-stop below)
  { top:[6,11,31],     horizon:[22,34,74] }        // night
];
const SUNSET_LOW = [255,216,102]; // extra warm horizon glow used only mid-sunset

let phase = 0; // continuous, wraps mod 3 (0 day, 1 sunset, 2 night)
const CYCLE_SECONDS = 220; // full day->sunset->night->day loop

function lerp(a,b,t){ return a + (b-a)*t; }
function lerpColor(c1,c2,t){ return [Math.round(lerp(c1[0],c2[0],t)), Math.round(lerp(c1[1],c2[1],t)), Math.round(lerp(c1[2],c2[2],t))]; }
function rgbStr(c, a=1){ return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }

function currentSkyColors(){
  const p = ((phase % 3) + 3) % 3;
  const i = Math.floor(p);
  const frac = p - i;
  const a = SKY_STOPS[i];
  const b = SKY_STOPS[(i+1) % 3];
  let top = lerpColor(a.top, b.top, frac);
  let horizon = lerpColor(a.horizon, b.horizon, frac);
  // extra warmth boost mid-sunset for a glowing horizon band
  if(i === 1){
    const warm = 1 - Math.abs(frac - 0.5) * 2; // peaks at frac=0.5
    horizon = lerpColor(horizon, SUNSET_LOW, Math.max(0, warm) * 0.6);
  }
  return { top, horizon, p };
}
function nightWeight(p){
  // 0 far from night(2), 1 at night
  const d = Math.min(Math.abs(p-2), 3-Math.abs(p-2));
  return Math.max(0, 1 - d/1.0);
}
function dayWeight(p){
  const d = Math.min(Math.abs(p-0), 3-Math.abs(p-0));
  return Math.max(0, 1 - d/1.0);
}

/* ---- Clouds (parallax) ---- */
let clouds = [];
function initClouds(){
  clouds = [];
  const layers = [
    { count:3, speed:2.5,  scale:1.5, y:[0.10,0.22], opacity:0.35 },
    { count:4, speed:6,    scale:1.0, y:[0.15,0.32], opacity:0.55 },
    { count:5, speed:11,   scale:0.7, y:[0.20,0.40], opacity:0.8 }
  ];
  layers.forEach((layer, li) => {
    for(let i=0;i<layer.count;i++){
      clouds.push({
        x: Math.random()*window.innerWidth,
        y: window.innerHeight * lerp(layer.y[0], layer.y[1], Math.random()),
        scale: layer.scale * (0.8 + Math.random()*0.5),
        speed: layer.speed,
        opacity: layer.opacity,
        layer: li
      });
    }
  });
}
function drawCloudShape(ctx, x, y, scale, fill){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.ellipse(0,0,42,20,0,0,Math.PI*2);
  ctx.ellipse(-28,6,26,16,0,0,Math.PI*2);
  ctx.ellipse(30,8,24,15,0,0,Math.PI*2);
  ctx.ellipse(6,-14,26,18,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ---- Stars ---- */
let stars = [];
function initStars(){
  stars = [];
  for(let i=0;i<70;i++){
    stars.push({ x:Math.random(), y:Math.random()*0.6, r:0.6+Math.random()*1.6, phase:Math.random()*Math.PI*2, speed:0.5+Math.random()*1.2 });
  }
}

/* ---- Sun / Moon ---- */
function drawSunMoon(ctx, p, w, h, t){
  const dw = dayWeight(p), nw = nightWeight(p);
  const x = (p/3) * (w + 200) - 100;
  const y = h*0.22 - Math.sin((p/3)*Math.PI) * h*0.10;
  const col = lerpColor([255,216,102],[230,236,245], nw);
  ctx.save();
  ctx.shadowColor = rgbStr(col, 0.9);
  ctx.shadowBlur = 30 + 20*(1-nw);
  ctx.fillStyle = rgbStr(col, 0.5 + 0.5*Math.max(dw,nw));
  ctx.beginPath();
  ctx.arc(x, y, 34, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ---- Background sky render ---- */
function renderSky(t){
  const w = skyCanvas.width, h = skyCanvas.height;
  const { top, horizon, p } = currentSkyColors();
  const grad = skyCtx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, rgbStr(top));
  grad.addColorStop(1, rgbStr(horizon));
  skyCtx.fillStyle = grad;
  skyCtx.fillRect(0,0,w,h);

  // stars
  const nw = nightWeight(p);
  if(nw > 0.02){
    stars.forEach(s => {
      const twinkle = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
      skyCtx.fillStyle = `rgba(255,255,255,${(nw*twinkle*0.9).toFixed(3)})`;
      skyCtx.beginPath();
      skyCtx.arc(s.x*w, s.y*h, s.r, 0, Math.PI*2);
      skyCtx.fill();
    });
  }

  drawSunMoon(skyCtx, p, w, h, t);

  // clouds tinted by phase
  const cloudDay = [255,255,255];
  const cloudSunset = [255,205,175];
  const cloudNight = [35,46,80];
  let cloudColor;
  const pp = ((p%3)+3)%3;
  if(pp < 1) cloudColor = lerpColor(cloudDay, cloudSunset, pp);
  else if(pp < 2) cloudColor = lerpColor(cloudSunset, cloudNight, pp-1);
  else cloudColor = lerpColor(cloudNight, cloudDay, pp-2);

  clouds.forEach(c => {
    c.x -= c.speed * (1/60);
    if(c.x < -120) c.x = w + 120;
    drawCloudShape(skyCtx, c.x, c.y, c.scale, rgbStr(cloudColor, c.opacity));
  });
}

/* ---- Drawing engine: strokes & stamps as living vector objects ---- */
let strokes = [];
let stamps = [];
let currentStroke = null;
let drawing = false;

const PALETTE = ['#FF6F59','#FFB347','#FFD866','#6BCB77','#2FA8B0','#4C8FBF','#B565D9','#FFFFFF'];
let currentColor = PALETTE[0];
let currentSize = 9;
let neonOn = false;
let tool = 'brush'; // 'brush' | 'stamp'
let currentStampType = 'sun';

const MAX_STROKES = 140;
const MAX_STAMPS = 60;
const MAX_POINTS_PER_STROKE = 400;

function canvasPos(e){
  const rect = drawCanvas.getBoundingClientRect();
  const cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  const cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
  return { x: cx - rect.left, y: cy - rect.top };
}

function placeStamp(x,y){
  stamps.push({
    type: currentStampType, x, y, size: 46 + Math.random()*10,
    bobPhase: Math.random()*Math.PI*2, bobAmp: 3+Math.random()*3, bobFreq: 0.4+Math.random()*0.3
  });
  if(stamps.length > MAX_STAMPS) stamps.shift();
}

drawCanvas.addEventListener('pointerdown', (e) => {
  const pos = canvasPos(e);
  if(tool === 'stamp'){ placeStamp(pos.x,pos.y); return; }
  drawing = true;
  currentStroke = {
    points:[pos], color: currentColor, size: currentSize, neon: neonOn,
    bobPhase: Math.random()*Math.PI*2, bobAmp: 2+Math.random()*2.5, bobFreq: 0.4+Math.random()*0.4
  };
});
drawCanvas.addEventListener('pointermove', (e) => {
  if(!drawing || !currentStroke) return;
  const pos = canvasPos(e);
  const last = currentStroke.points[currentStroke.points.length-1];
  const dx = pos.x-last.x, dy = pos.y-last.y;
  if(dx*dx+dy*dy > 9){
    currentStroke.points.push(pos);
    if(currentStroke.points.length > MAX_POINTS_PER_STROKE) currentStroke.points.shift();
  }
});
function endStroke(){
  if(drawing && currentStroke && currentStroke.points.length > 1){
    strokes.push(currentStroke);
    if(strokes.length > MAX_STROKES) strokes.shift();
  }
  drawing = false;
  currentStroke = null;
}
drawCanvas.addEventListener('pointerup', endStroke);
drawCanvas.addEventListener('pointerleave', endStroke);
drawCanvas.addEventListener('pointercancel', endStroke);

function strokePath(ctx, points, offsetY){
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y + offsetY);
  for(let i=1;i<points.length;i++) ctx.lineTo(points[i].x, points[i].y + offsetY);
  ctx.stroke();
}

function renderStroke(ctx, s, t){
  const off = Math.sin(t*s.bobFreq + s.bobPhase) * s.bobAmp;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = s.size;
  ctx.strokeStyle = s.color;
  if(s.neon){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = s.color;
    ctx.shadowBlur = 16;
    strokePath(ctx, s.points, off);
    ctx.shadowBlur = 26;
    ctx.globalAlpha = 0.5;
    strokePath(ctx, s.points, off);
    ctx.restore();
  }else{
    ctx.shadowBlur = 0;
    strokePath(ctx, s.points, off);
  }
}

/* ---- Stamp icons ---- */
function drawStampIcon(ctx, type, x, y, size){
  ctx.save();
  ctx.translate(x,y);
  const s = size/50;
  ctx.scale(s,s);
  switch(type){
    case 'sun':
      ctx.fillStyle = '#FFD866';
      ctx.shadowColor = '#FFD866'; ctx.shadowBlur = 14;
      for(let i=0;i<8;i++){
        ctx.save(); ctx.rotate(i*Math.PI/4);
        ctx.fillRect(-3,-34,6,14);
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0,0,18,0,Math.PI*2); ctx.fill();
      break;
    case 'cloud':
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.ellipse(0,0,26,14,0,0,Math.PI*2);
      ctx.ellipse(-16,4,16,10,0,0,Math.PI*2);
      ctx.ellipse(18,5,15,9,0,0,Math.PI*2);
      ctx.ellipse(4,-10,16,12,0,0,Math.PI*2);
      ctx.fill();
      break;
    case 'star':
      ctx.fillStyle = '#FFD866';
      ctx.shadowColor = '#FFD866'; ctx.shadowBlur = 10;
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const ang = -Math.PI/2 + i*(Math.PI*2/5);
        const ang2 = ang + Math.PI/5;
        ctx.lineTo(Math.cos(ang)*24, Math.sin(ang)*24);
        ctx.lineTo(Math.cos(ang2)*10, Math.sin(ang2)*10);
      }
      ctx.closePath(); ctx.fill();
      break;
    case 'kite':
      ctx.fillStyle = '#FF6F59';
      ctx.beginPath();
      ctx.moveTo(0,-26); ctx.lineTo(18,0); ctx.lineTo(0,30); ctx.lineTo(-18,0);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,-26); ctx.lineTo(0,30); ctx.moveTo(-18,0); ctx.lineTo(18,0); ctx.stroke();
      ctx.strokeStyle = '#FFD866'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,30); ctx.quadraticCurveTo(10,42,4,52); ctx.stroke();
      break;
    case 'balloon':
      ctx.fillStyle = '#B565D9';
      ctx.beginPath(); ctx.ellipse(0,0,20,26,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-4,26); ctx.lineTo(4,26); ctx.lineTo(0,34); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0,34); ctx.lineTo(0,58); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-6,-8,5,7,0.4,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fill();
      break;
  }
  ctx.restore();
}

function renderDrawLayer(t){
  drawCtx.clearRect(0,0,drawCanvas.width, drawCanvas.height);
  strokes.forEach(s => renderStroke(drawCtx, s, t));
  if(drawing && currentStroke && currentStroke.points.length > 1){
    drawCtx.shadowBlur = currentStroke.neon ? 16 : 0;
    drawCtx.globalCompositeOperation = currentStroke.neon ? 'lighter' : 'source-over';
    drawCtx.strokeStyle = currentStroke.color;
    drawCtx.shadowColor = currentStroke.color;
    drawCtx.lineWidth = currentStroke.size;
    strokePath(drawCtx, currentStroke.points, 0);
    drawCtx.globalCompositeOperation = 'source-over';
  }
  stamps.forEach(st => {
    const off = Math.sin(t*st.bobFreq + st.bobPhase) * st.bobAmp;
    drawCtx.shadowBlur = 0;
    drawStampIcon(drawCtx, st.type, st.x, st.y + off, st.size);
  });
}

/* ---- Main loop ---- */
let startTime = null;
let loopRunning = false;
function startLoop(){
  if(loopRunning) return;
  loopRunning = true;
  startTime = performance.now();
  requestAnimationFrame(loopStep);
}
function loopStep(now){
  if(!loopRunning) return;
  const t = (now - startTime) / 1000;
  phase = (t / CYCLE_SECONDS) * 3;
  renderSky(t);
  renderDrawLayer(t);
  requestAnimationFrame(loopStep);
}

/* ---- Toolbar wiring ---- */
const colorRow = document.getElementById('colorRow');
PALETTE.forEach((c,i) => {
  const b = document.createElement('button');
  b.className = 'swatch' + (i===0 ? ' selected' : '');
  b.style.background = c;
  b.addEventListener('click', () => {
    currentColor = c; tool = 'brush';
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('selected'));
    b.classList.add('selected');
    document.getElementById('stampTray').classList.add('hidden');
    document.getElementById('stampToggle').classList.remove('active');
  });
  colorRow.appendChild(b);
});

function setSize(sz, btn){
  currentSize = sz; tool = 'brush';
  document.querySelectorAll('#sizeSmall,#sizeMedium,#sizeLarge').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
document.getElementById('sizeSmall').addEventListener('click', (e)=> setSize(4, e.currentTarget));
document.getElementById('sizeMedium').addEventListener('click', (e)=> setSize(9, e.currentTarget));
document.getElementById('sizeLarge').addEventListener('click', (e)=> setSize(16, e.currentTarget));
document.getElementById('sizeMedium').classList.add('active');

document.getElementById('neonToggle').addEventListener('click', (e) => {
  neonOn = !neonOn;
  e.currentTarget.classList.toggle('active', neonOn);
});

const stampTray = document.getElementById('stampTray');
document.getElementById('stampToggle').addEventListener('click', (e) => {
  const opening = stampTray.classList.contains('hidden');
  stampTray.classList.toggle('hidden');
  e.currentTarget.classList.toggle('active', opening);
  if(opening){
    tool = 'stamp';
  }else{
    tool = 'brush';
  }
});
document.querySelectorAll('.stamp-btn').forEach(b => {
  b.addEventListener('click', () => {
    currentStampType = b.dataset.stamp;
    tool = 'stamp';
    document.querySelectorAll('.stamp-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
  });
});

document.getElementById('skyToggleBtn').addEventListener('click', () => {
  phase = (Math.floor(((phase%3)+3)%3) + 1) % 3;
  // re-anchor startTime so the auto-drift continues smoothly from the new phase
  startTime = performance.now() - (phase/3)*CYCLE_SECONDS*1000;
});

document.getElementById('clearBtn').addEventListener('click', () => {
  strokes = []; stamps = []; currentStroke = null; drawing = false;
  showToast('Fresh sky! 🌤️');
});

/* ---------------- Save to gallery ---------------- */
function compositeImage(){
  const off = document.createElement('canvas');
  off.width = drawCanvas.width; off.height = drawCanvas.height;
  const octx = off.getContext('2d');
  octx.drawImage(skyCanvas, 0, 0);
  octx.drawImage(drawCanvas, 0, 0);
  return off;
}
function loadLocalGallery(){
  try{ const raw = localStorage.getItem(galleryKey()); if(raw) return JSON.parse(raw); }catch(e){}
  return [];
}
function saveLocalGallery(items){
  try{ localStorage.setItem(galleryKey(), JSON.stringify(items.slice(-12))); }catch(e){
    // storage full - drop oldest and retry once
    try{ localStorage.setItem(galleryKey(), JSON.stringify(items.slice(-6))); }catch(e2){}
  }
}
function refreshGalleryBadge(){
  const items = loadLocalGallery();
  document.getElementById('galleryBadge').textContent = items.length;
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const off = compositeImage();
  off.toBlob(async (blob) => {
    if(!blob){ showToast('Could not save right now.'); return; }
    const id = 'art_' + Date.now();
    if(firebaseReady && storage && db && currentUser && !currentUser.guest){
      try{
        const ref = storage.ref().child(`artwork/${currentUser.uid}/${id}.png`);
        await ref.put(blob);
        const url = await ref.getDownloadURL();
        await db.collection('children').doc(currentUser.uid).collection('gallery').doc(id).set({
          url, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        const items = loadLocalGallery();
        items.push({ id, url });
        saveLocalGallery(items);
      }catch(e){
        console.warn('Cloud save failed, saving locally instead.', e);
        await saveAsLocalDataUrl(off, id);
      }
    }else{
      await saveAsLocalDataUrl(off, id);
    }
    refreshGalleryBadge();
    showToast('Saved to gallery! 🎉');
  }, 'image/png');
});

function saveAsLocalDataUrl(off, id){
  return new Promise((resolve) => {
    const url = off.toDataURL('image/png');
    const items = loadLocalGallery();
    items.push({ id, url });
    saveLocalGallery(items);
    resolve();
  });
}

/* ---------------- Gallery screen ---------------- */
async function loadRemoteGallery(){
  if(!firebaseReady || !db || !currentUser || currentUser.guest) return null;
  try{
    const snap = await db.collection('children').doc(currentUser.uid).collection('gallery').orderBy('createdAt','desc').limit(24).get();
    return snap.docs.map(d => ({ id:d.id, url:d.data().url }));
  }catch(e){ console.warn('Gallery load failed, using local.', e); return null; }
}

async function renderGallery(){
  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = '<div class="gallery-empty">Loading...</div>';
  const remote = await loadRemoteGallery();
  const items = remote || loadLocalGallery();
  grid.innerHTML = '';
  if(!items.length){
    grid.innerHTML = '<div class="gallery-empty">No paintings yet — go make some sky magic! ✨</div>';
    return;
  }
  items.slice().reverse().forEach(item => {
    const cell = document.createElement('div');
    cell.className = 'gallery-item';
    const img = document.createElement('img');
    img.src = item.url;
    img.addEventListener('click', () => openViewer(item));
    cell.appendChild(img);
    grid.appendChild(cell);
  });
}

let viewerItem = null;
function openViewer(item){
  viewerItem = item;
  document.getElementById('viewerImg').src = item.url;
  document.getElementById('viewerModal').classList.add('active');
}
document.getElementById('viewerCloseBtn').addEventListener('click', () => {
  document.getElementById('viewerModal').classList.remove('active');
});
document.getElementById('viewerDeleteBtn').addEventListener('click', async () => {
  if(!viewerItem) return;
  const items = loadLocalGallery().filter(i => i.id !== viewerItem.id);
  saveLocalGallery(items);
  if(firebaseReady && db && currentUser && !currentUser.guest){
    try{ await db.collection('children').doc(currentUser.uid).collection('gallery').doc(viewerItem.id).delete(); }catch(e){}
    if(storage){
      try{ await storage.ref().child(`artwork/${currentUser.uid}/${viewerItem.id}.png`).delete(); }catch(e){}
    }
  }
  document.getElementById('viewerModal').classList.remove('active');
  refreshGalleryBadge();
  renderGallery();
});

document.getElementById('galleryOpenBtn').addEventListener('click', () => {
  showScreen('galleryScreen');
  renderGallery();
});
document.getElementById('galleryBackBtn').addEventListener('click', () => {
  showScreen('homeScreen');
});

/* ---------------- Init ---------------- */
resizeCanvases();
initClouds();
initStars();
window.addEventListener('resize', () => { initClouds(); });
</script>
